name: Python smoke tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[neural]'
      - run: python -m unittest discover -s tests -v
      - run: python -m tdoa_mpr.train --steps 2 --batch-size 4 --hidden 16 --iterations 2 --output runs/ci.pt
      - run: python -m tdoa_mpr.evaluate --checkpoint runs/ci.pt --samples 4 --wls-samples 1 --output runs/ci.json
